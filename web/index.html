<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sturnus</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script>
  try { const t = JSON.parse(localStorage.getItem('deck.theme') || '"auto"'); document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t } catch {}
</script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><a class="lay-btn" id="layBtn" href="#/" title="总览：所有工作区" aria-label="Sturnus 总览" data-i18n-title data-i18n-label><img class="logo" src="icon.svg" alt=""></a><a class="word" href="#/">Sturnus</a></div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="bar-right">
      <button class="search-trigger" id="searchBtn" type="button"><svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.6"/><path d="m13 13 4 4"/></svg><span data-i18n>搜索工作区、项目、会话</span><kbd>/</kbd></button>
      <button class="new-btn" id="newBtn" type="button" title="新建会话（N）" data-i18n-title><svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg><span data-i18n>新建会话</span></button>
      <span class="conn" id="conn" title="与本机 sturnus 服务的连接" data-i18n-title><i></i><span>实时</span></span>
      <button class="icon-btn" id="themeBtn" type="button" title="主题"></button>
      <button class="icon-btn" id="settingsBtn" type="button" title="设置" data-i18n-title>
        <svg viewBox="0 0 20 20"><path d="M8.6 2.8h2.8l.4 2 1.6.9 1.9-.7 1.4 2.4-1.5 1.3v1.8l1.5 1.3-1.4 2.4-1.9-.7-1.6.9-.4 2H8.6l-.4-2-1.6-.9-1.9.7-1.4-2.4 1.5-1.3V9.1L3.3 7.8l1.4-2.4 1.9.7 1.6-.9z"/><circle cx="10" cy="10" r="2.3"/></svg>
      </button>
    </div>
  </header>
  <div class="shell"><nav class="rail" id="rail" aria-label="工作区与全局入口" data-i18n-label></nav><aside class="side" id="side"></aside><main class="view" id="view"></main><div class="side-edge"><button class="side-handle" id="sideHandle" type="button" title="收起旁边那栏（⌘B）"></button></div></div>
  <aside class="asst" id="asst" hidden></aside>
  <button class="asst-fab" id="asstBtn" type="button" title="助手：问各个会话的事（⌘/Ctrl+J）" data-i18n-title><svg class="i-open" viewBox="0 0 16 16"><path d="M8 2.5v3M8 10.5v3M2.5 8h3M10.5 8h3M4.2 4.2l2 2M9.8 9.8l2 2M4.2 11.8l2-2M9.8 6.2l2-2"/></svg><svg class="i-close" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg><i class="dot-new"></i></button>
  <footer class="status" id="status"></footer>
</div>

<div class="ovl" id="palette" hidden>
  <div class="scrim" data-close></div>
  <div class="palette" role="dialog" aria-label="搜索会话" data-i18n-label>
    <div class="palette-input"><svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.6"/><path d="m13 13 4 4"/></svg><input id="paletteQ" placeholder="工作区、项目、会话的名字，任务，目录……" data-i18n-ph></div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> <i data-i18n>选择</i></span><span><kbd>Enter</kbd> <i data-i18n>打开</i></span><span><kbd>⌘Enter</kbd> <i data-i18n>进终端</i></span><span><kbd>Esc</kbd> <i data-i18n>关闭</i></span></div>
  </div>
</div>

<div class="ovl" id="newSess" hidden>
  <div class="scrim" data-close></div>
  <div class="modal single" role="dialog" aria-label="新建会话" data-i18n-label><div class="modal-body" id="newBody"></div></div>
</div>

<div class="ovl" id="settings" hidden>
  <div class="scrim" data-close></div>
  <div class="modal" role="dialog" aria-label="设置" data-i18n-label>
    <nav class="modal-nav" id="settingsNav">
      <h3 data-i18n>设置</h3>
      <button data-pane="models" class="on" data-i18n>助手与模型</button>
      <button data-pane="voice" data-i18n>语音输入</button>
      <button data-pane="look" data-i18n>显示</button>
      <button data-pane="access" data-i18n>访问</button>
      <button data-pane="about" data-i18n>关于</button>
    </nav>
    <div class="modal-body" id="settingsBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
