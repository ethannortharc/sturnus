<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sturnus</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="/style.css">
<script>
  try { const t = JSON.parse(localStorage.getItem('deck.theme') || '"auto"'); document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t } catch {}
  try { document.documentElement.dataset.skin = JSON.parse(localStorage.getItem('deck.skin') || '"graphite"') } catch {}
</script>
<style>
  .signin { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .signin form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-card); box-shadow: var(--shadow-3); padding: 28px 26px 24px; }
  .signin .head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
  .signin h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: -.015em; }
  .signin p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .signin code { font: 12.5px var(--font-mono); background: var(--sunk); border: 1px solid var(--hair-2); border-radius: 6px; padding: 1px 6px; color: var(--ink-2); }
  .signin input { width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--hair); background: var(--panel-2); font: 13.5px var(--font-mono); outline: none; }
  .signin input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .signin .btn { width: 100%; height: 40px; justify-content: center; margin-top: 12px; font-size: 13.5px; }
  .signin .err { min-height: 18px; margin-top: 10px; color: var(--bad); font-size: 12.5px; }
</style>
</head>
<body>
<main class="signin">
  <form id="f" autocomplete="off">
    <div class="head"><img class="logo" src="icon.svg" alt="">Sturnus</div>
    <h1 id="h">登录</h1>
    <p id="p">在这台机器的终端里运行 <code>sturnus token</code>，把令牌粘贴到这里。这个浏览器会保持登录 30 天。</p>
    <input id="t" type="password" placeholder="登录令牌" autofocus aria-label="登录令牌">
    <button class="btn primary" id="b" type="submit">登录</button>
    <div class="err" id="e" role="alert"></div>
  </form>
</main>
<script>
  // language: the choice made in the deck (Settings → Display), else the browser's
  const TX = {
    en: { h: 'Sign in', p: 'Run <code>sturnus token</code> in a terminal on this machine and paste the token here. This browser stays signed in for 30 days.', t: 'Sign-in token', b: 'Sign in', bad: 'Could not sign in', off: 'Can’t reach the Sturnus service' },
    zh: { h: '登录', p: '在这台机器的终端里运行 <code>sturnus token</code>，把令牌粘贴到这里。这个浏览器会保持登录 30 天。', t: '登录令牌', b: '登录', bad: '登录不了', off: '没连上 sturnus 服务' },
  };
  let LANG = 'zh';
  try { const v = JSON.parse(localStorage.getItem('deck.lang') || '"auto"'); LANG = v === 'en' ? 'en' : v === 'zh' ? 'zh' : /^zh/i.test(navigator.language || 'zh') ? 'zh' : 'en'; } catch {}
  const X = TX[LANG];
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.getElementById('h').textContent = X.h;
  document.getElementById('p').innerHTML = X.p;
  document.getElementById('t').placeholder = X.t;
  document.getElementById('t').setAttribute('aria-label', X.t);
  document.getElementById('b').textContent = X.b;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const e = document.getElementById('e'); e.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Deck': '1', 'X-Lang': LANG }, body: JSON.stringify({ token: document.getElementById('t').value }) });
      const j = await r.json();
      if (j.ok) location.replace('/' + location.hash); else e.textContent = j.msg || X.bad;
    } catch (x) { e.textContent = X.off; }
  };
</script>
</body>
</html>
